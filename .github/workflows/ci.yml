name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Tests and release integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-solution.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-solution.txt
      - name: Run engineering tests
        run: python -m unittest discover -s tests -v
      - name: Verify frozen release hashes
        run: python tools/verify_release.py
      - name: Validate submission format
        run: python -m possession validate "submission/Xtension Labs.csv"
